# By hand: copy what you changed in Supabase (games, parts) to the website right away,
# without waiting for the weekly update and without asking RAWG.
# GitHub → Actions → "Publikovat změny z databáze" → Run workflow.
name: Publikovat změny z databáze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Databáze → soubory webu
        env:
          MODE: export
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node tools/update-data.js

      - name: Uložit změny
        run: |
          if git diff --quiet -- data/; then
            echo "Žádné změny."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/games.js data/parts.js
            git commit -m "Publikování změn z databáze"
            git push
          fi
